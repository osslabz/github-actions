name: test

on:
  push:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # commit-subject-check reads the pushed range
          fetch-depth: 0

      - name: check-commit-subjects
        uses: ./commit-subject-check
        with:
          default-branch: main

      - name: snapshot-version-tests
        run: snapshot-version/test/run.sh

      - name: commit-subject-check-tests
        run: commit-subject-check/test/run.sh

      # The script tests cover the derivation; the steps below run the action itself, as a
      # caller does. Maven cannot read the default branch's fixture, so rewriting it fails.
      - name: write-snapshot-version-fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/default-branch" "$RUNNER_TEMP/feature-branch" "$RUNNER_TEMP/mixed-case-branch"
          printf '<project>\n    <version>0.2.1-SNAPSHOT</version>\n</project>\n' \
            > "$RUNNER_TEMP/default-branch/pom.xml"
          cat > "$RUNNER_TEMP/feature-branch/pom.xml" <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
              <modelVersion>4.0.0</modelVersion>
              <groupId>net.osslabz.test</groupId>
              <artifactId>fixture</artifactId>
              <version>0.2.1-SNAPSHOT</version>
              <packaging>pom</packaging>
          </project>
          POM
          cat > "$RUNNER_TEMP/mixed-case-branch/pom.xml" <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
              <modelVersion>4.0.0</modelVersion>
              <groupId>net.osslabz.test</groupId>
              <artifactId>fixture</artifactId>
              <version>0.2.1-SNAPSHOT</version>
              <packaging>pom</packaging>
          </project>
          POM

      - name: snapshot-version-on-default-branch
        id: on-default-branch
        uses: ./snapshot-version
        with:
          pom: ${{ runner.temp }}/default-branch/pom.xml
          branch: dev

      - name: snapshot-version-on-feature-branch
        id: on-feature-branch
        uses: ./snapshot-version
        with:
          pom: ${{ runner.temp }}/feature-branch/pom.xml
          branch: feat/fixture

      # GitHub Actions' `!=` is case-insensitive, so `Dev` must still be treated as a branch of
      # its own, folded into the version and rewritten in the pom, exactly like any other
      # branch that isn't the (case-sensitive) default.
      - name: snapshot-version-on-mixed-case-branch
        id: on-mixed-case-branch
        uses: ./snapshot-version
        with:
          pom: ${{ runner.temp }}/mixed-case-branch/pom.xml
          branch: Dev

      - name: check-snapshot-version-results
        env:
          DEFAULT_BRANCH_VERSION: ${{ steps.on-default-branch.outputs.version }}
          FEATURE_BRANCH_VERSION: ${{ steps.on-feature-branch.outputs.version }}
          MIXED_CASE_BRANCH_VERSION: ${{ steps.on-mixed-case-branch.outputs.version }}
        run: |
          test "$DEFAULT_BRANCH_VERSION" = 0.2.1-SNAPSHOT
          test "$FEATURE_BRANCH_VERSION" = 0.2.1-feat-fixture-SNAPSHOT
          grep -q '<version>0.2.1-feat-fixture-SNAPSHOT</version>' "$RUNNER_TEMP/feature-branch/pom.xml"
          test "$MIXED_CASE_BRANCH_VERSION" = 0.2.1-Dev-SNAPSHOT
          grep -q '<version>0.2.1-Dev-SNAPSHOT</version>' "$RUNNER_TEMP/mixed-case-branch/pom.xml"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A checksum-verified download rather than a third-party action. actionlint also runs
      # the runner's shellcheck over every run: block.
      - name: install-actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${archive}"
          echo "${SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint

      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'

      # actionlint's own shellcheck pass covers a workflow's inline `run:` blocks, not the
      # composite actions' standalone scripts. Same pattern as install-actionlint: a
      # checksum-verified download rather than a third-party action.
      - name: install-shellcheck
        env:
          VERSION: 0.11.0
          SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="shellcheck-v${VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${VERSION}/${archive}"
          echo "${SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" "shellcheck-v${VERSION}/shellcheck"
          mv "$RUNNER_TEMP/shellcheck-v${VERSION}/shellcheck" "$RUNNER_TEMP/shellcheck"

      - name: shellcheck
        run: |
          "$RUNNER_TEMP/shellcheck" \
            commit-subject-check/check-commit-subjects.sh \
            commit-subject-check/test/run.sh \
            snapshot-version/branch-version.sh \
            snapshot-version/test/run.sh
