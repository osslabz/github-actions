version: 2
updates:
  # The pins in .github/workflows, the reusable workflows' included. The composite actions
  # use no other action. Updates reach callers only with the next v1 tag, after review here.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
